# The conversions the Logix ST writer writes (#255, #297, #367, #368),
# each into its own result tag, run on both runtimes with `naut test` and
# `naut test --target logix`. What the writer refuses (logix/conversion)
# cannot be here; convert_test.go has those cases, and logix-authoring.md
# §4 has the table of what the controller was seen to do.
