    source: "#from-the-editor"
    tests:
      - go ./logix/facade TestDeployStreamDownload
      - go ./cmd/naut TestLogixServePlaneDownloadRewarmsTheSession
      - go ./cmd/naut TestLogixServePlaneReleasesTheSessionBeforeADownload
