page: website/src/content/docs/guides/logix-authoring.md
title: Authoring for Logix (experimental)
prefix: LGA
claims:
  - id: LGA-001
    claim: >-
      The manifest tags a program names become controller-scope Logix tags
      carrying their initial values and descriptions; a tag no program names
      is not written.
    source: "#a-project-with-a-logix-target"
    tests:
      - go ./logix/writer TestManifestInitsAndDescriptionsLandOnControllerTags
      - go ./logix/writer TestImplicitTagsBecomeControllerTags

  - id: LGA-002
    claim: >-
      `VAR_EXTERNAL` is optional: a ladder or ST program that names a
      manifest tag it did not declare still gets its controller tag, typed
      from the manifest. A manifest tag with no `role:` stops `naut logix
      deploy` and `naut logix write` with an error naming the tag.
    source: "#a-project-with-a-logix-target"
    tests:
      - go ./logix/writer TestImplicitTagsBecomeControllerTags
      - go ./logix/writer TestImplicitTagsInST
      - go ./logix/writer TestImplicitTagsLadderMembersAndLiterals
      - go ./cmd/naut TestLogixDeployTypesUndeclaredTagsFromTheManifest
      - go ./cmd/naut TestLogixDeployRefusesATagWithNoRole
    note: >-
      The CLI test deploys (to a fake agent) and writes a project whose ladder
      names four manifest tags it never declares: each becomes a controller
      tag typed from nautilus.yaml, `type:` where given (INT over the REAL
      `init: 0` would imply; DINT with no init) and else the type `init:`
      implies (REAL, BOOL); a manifest tag no rung names is not written. A
      tag with no role: is refused by name (exit 2) by `naut logix deploy`,
      before anything reaches the agent, and by `naut logix write`.

  - id: LGA-003
    claim: >-
      The task becomes a periodic Logix task at the task's scan rate, the
      program a Logix program and its rungs the `MainRoutine`.
    source: "#a-project-with-a-logix-target"
    tests:
      - go ./logix/writer TestTaskSchedulesTheProgram
      - go ./logix/writer TestDemoLineMatchesTheRealExport
      - go ./cmd/naut TestLogixDeployNamesTheTaskProgramAndRoutine
    note: >-
      The CLI test deploys a project (to a fake agent) and reads the L5X it
      sends: a PERIODIC task at the task's 250 ms scan scheduling the program,
      the program named for the POU with the rungs as MainRoutine and its VAR
      as program (not controller) tags, and with `program`, `routine` and
      `task` under target.logix the three renamed.

  - id: LGA-004
    claim: >-
      `side.heartbeat` adds a second Logix program, `Nautilus`, scheduled
      after the user's, that counts task scans in the named DINT and never
      touches the user's routine.
    source: "#a-project-with-a-logix-target"
    tests:
      - go ./logix/writer TestSideCodeHeartbeat

  - id: LGA-005
    claim: >-
      The Logix target takes one task running one ladder or structured text
      program; a multi-task project and FBD or SFC programs are refused.
    source: "#what-the-target-accepts"
    tests:
      - go ./cmd/naut TestCheckTargetLogixRefusesOtherLanguages
      - go ./cmd/naut TestLogixTargetRefusesSFCAndASecondTask
    note: >-
      FBD and SFC programs are refused by `naut check --target logix` (an SFC
      chart that checks clean without the target); `naut logix deploy` refuses
      an SFC task program and a project with two tasks.

  - id: LGA-006
    claim: >-
      Contacts `X` `/X`, branches (nesting kept) and coils `( X )`
      `( S X )` `( R X )` are written as `XIC` `XIO`, `[ , ]` and `OTE`
      `OTL` `OTU`.
    source: "#what-the-target-accepts"
    tests:
      - go ./logix/writer TestNeutralTextSpelling

  - id: LGA-007
    claim: >-
      Edge contacts and edge coils (`+X`, `-X`, `( P X )`, `( N X )`) are
      written as `ONS` and `OSF` with generated storage bits.
    source: "#what-the-target-accepts"
    tests:
      - go ./logix/writer TestEdgeCoils
      - go ./logix/writer TestEdgeAtBranchLegHead
      - go ./logix/writer TestGolden/subset
    note: "`-X` (to `OSF`) is asserted only through the subset golden snapshot."

  - id: LGA-008
    claim: >-
      Compares become the Logix compare instructions (an expression operand
      becomes `CMP`), and `{ y := expr }` becomes `MOVE`, `ADD`, `SUB`,
      `MUL` or `DIV` for one operation on plain operands, `ABS` for
      `ABS(x)`, and `CPT` for anything else (`MOD`, unary `-`, `SQRT` as
      `SQR`, `**` or `EXPT`, nested expressions).
    source: "#what-the-target-accepts"
    tests:
      - go ./logix/writer TestAssignmentsAndExpressionCompares
      - go ./logix/writer TestGolden/subset
      - go ./logix/writer TestLEIsAPlainCompare
    note: >-
      MOVE, ADD, SUB, MUL, DIV, ABS, CPT (including MOD, unary minus, SQRT,
      ** and EXPT) and CMP are asserted, and the plain compares GE, NE, GT,
      LT (golden snapshot) and LE.

  - id: LGA-009
    claim: >-
      In ladder, `TON`, `TOF` and `CTU` blocks are written as the Logix
      instructions on `TIMER` / `COUNTER` tags; in ST, as `TONR(t)` (with
      `t.Reset := NOT IN`), `TOFR(t)` and `CTUD(c)` on `FBD_TIMER` /
      `FBD_COUNTER` tags. Either way `t.Q` is written as `t.DN`, `t.ET` as
      `t.ACC` and `c.CV` as `c.ACC`.
    source: "#what-the-target-accepts"
    tests:
      - go ./logix/writer TestNeutralTextSpelling
      - go ./logix/writer TestCounterEndsItsRung
      - go ./logix/writer TestOutputCapturesAndResetConditions
      - go ./logix/writer TestGolden/subset
      - go ./logix/writer TestStructuredText
      - go ./logix/writer TestSTTOFAndCounterValue
    note: >-
      Ladder `TOF` and the `TIMER` / `COUNTER` tag types are asserted through
      the subset golden snapshot; the ST TON and CTU forms and the
      `FBD_TIMER` / `FBD_COUNTER` types by TestStructuredText, ST `TOF` and
      `c.CV` by TestSTTOFAndCounterValue, ladder `c.CV` by
      TestOutputCapturesAndResetConditions.

  - id: LGA-010
    claim: >-
      `Word.3` is written as bit 3 of the word, as Logix spells it.
    source: "#what-the-target-accepts"
    tests:
      - go ./logix/writer TestBitAccessPassesThrough

  - id: LGA-011
    claim: >-
      An array of timers or counters (`ARRAY [0..3] OF TON`) becomes one
      Logix `TIMER` or `COUNTER` tag with the array's dimension
      (`TIMER[4]`).
    source: "#what-the-target-accepts"
    tests:
      - go ./logix/writer TestArraysOfBlocks

  - id: LGA-012
    claim: >-
      TIME becomes a DINT of milliseconds where it feeds a preset, and the
      elementary types BOOL, SINT, INT, DINT, REAL, LREAL map to the same
      Logix types.
    source: "#what-the-target-accepts"
    tests:
      - go ./logix/writer TestTimerPresetLandsInTheTag
      - go ./logix/writer TestGolden/subset
    note: The elementary types are asserted through the subset golden snapshot (BOOL, SINT, INT, DINT, REAL, LREAL tags).

  - id: LGA-013
    claim: STRUCT types in a library become UDTs.
    source: "#what-the-target-accepts"
    tests:
      - go ./logix/writer TestUserDefinedTypes

  - id: LGA-014
    claim: >-
      Enumerations become `DINT` tags, and a member, plain or qualified
      (`Run`, `Mode#Run`), is written as its integer value.
    source: "#what-the-target-accepts"
    tests:
      - go ./logix/writer TestEnumerationsAreDINT

  - id: LGA-015
    claim: >-
      A user FUNCTION_BLOCK, in ladder or ST, becomes an Add-On
      Instruction.
    source: "#what-the-target-accepts"
    tests:
      - go ./logix/writer TestAddOnInstructionFromLadderBlock
      - go ./logix/writer TestAddOnInstructionPowerAndST

  - id: LGA-016
    claim: >-
      An ST program's assignments, IF, CASE, FOR, WHILE, REPEAT, EXIT,
      operators and maths are written as Logix ST, close to as written.
    source: "#what-the-target-accepts"
    tests:
      - go ./logix/writer TestStructuredText
      - go ./logix/writer TestStructuredTextLoopsAndExit
    note: >-
      Assignments, IF/ELSIF, CASE, FOR, operators and ABS/SQRT/EXPT are
      asserted, and WHILE, REPEAT ... UNTIL and an EXIT inside an IF in the
      loop, in order, as written.

  - id: LGA-038
    claim: >-
      An ST conversion is written as Logix that computes nautilus's result:
      a narrowing wraps in integer arithmetic, an integer meets REAL as
      `(v * 1.0)` where it would otherwise divide as integers, a BOOL
      becomes a number through an `IF`, and REAL to an integer as the whole
      right-hand side into a tag of that integer type is a plain store,
      which the controller rounds halves to even as nautilus does.
    source: "#what-the-target-accepts"
    tests:
      - go ./logix/writer TestConversionsWritten
      - go ./logix/writer TestGoldenConversions
      - go ./logix/writer TestNarrowingWrapMatchesNautilus
      - go ./logix/writer TestRealToIntegerStores
      - naut logix/writer/testdata/conformance/conversions case 1, xd = 70000, xr = 2.5
      - naut logix/writer/testdata/conformance/conversions case 10, xd = 5, xr = 3.5
      - naut logix/writer/testdata/conformance/conversions case 11, xd = -5, xr = -3.5
    partial: true
    note: >-
      The tests assert what is written and that the wrap equals nautilus's
      narrowing under either MOD sign rule. The conformance project
      `logix/writer/testdata/conformance/conversions` writes every written
      class into its own tag (and passes a conversion to a user block's
      input); its 12 scenarios pass on nautilus here and passed unchanged on
      an Echo v38 controller with `naut test --target logix` (#255,
      2026-10-14), exact to the bit with float32-exact REAL inputs. The
      controller run is not in CI.

  - id: LGA-017
    claim: >-
      What the target cannot express is a `naut check` diagnostic that names
      the construct, and the alternative where Logix has one, carries a
      stable `logix/<rule>` ID and a line, and stops the writer from
      emitting any document.
    source: "#rejected-at-check-time-by-name"
    tests:
      - go ./logix/writer TestRejections
      - go ./logix/writer TestStructuredTextRejections
      - go ./logix/writer TestUserDefinedTypeRejections
      - go ./logix/writer TestRefusalsTheTableNames
      - go ./logix/writer TestSTAndTypeRefusalsHaveALineAndWriteNothing
      - go ./logix/writer TestRefusalsNameTheAlternative
    partial: true
    note: >-
      Every rule has a case, including trailing-underscore names
      (logix/name) and an AOI with an array input or output (logix/type);
      ladder, ST and user-type refusals each assert a line and that no
      document is written. The alternative is asserted for twelve messages
      across logix/name, fb-pin, operand, time, member and array-shape, not
      for every message. The page names the exceptions with no alternative
      (STRING, a self-containing type, a binding the compiler cannot read).

  - id: LGA-039
    claim: >-
      `logix/conversion` refuses what the controller would compute
      differently: REAL to an integer inside an expression or into a tag of
      another type, an integer `/` whose quotient meets a REAL (stored into
      a REAL, beside a REAL operand, compared with a REAL), and unsigned,
      bit-string, LINT, LTIME and STRING conversions; an all-integer
      division is written unchanged. On a rung the same integer `/` is
      refused in a DIV or CPT into a REAL, a CPT beside a REAL and a CMP
      against a REAL; into an integer it is written as DIV or CPT.
    source: "#rejected-at-check-time-by-name"
    tests:
      - go ./logix/writer TestConversionsRefused
      - go ./logix/writer TestIntegerDivisionUnchanged
      - go ./logix/writer TestLadderIntegerDivision
      - naut logix/writer/testdata/conformance/division minus seven by two truncates toward zero
    note: >-
      That Logix divides integers in REAL beside a REAL (7 / 2 = 3.5) was
      observed on an Echo v38 controller, in ST (#361) and in ladder DIV,
      CPT and CMP (#368), not in CI. The written forms (`conformance/division`:
      DIV and CPT into an integer, a CMP against an integer, a quotient
      through a DINT tag into a REAL) passed 4 of 4 scenarios on the same
      controller.

  - id: LGA-040
    claim: >-
      In an ST call to a user block, each input must be a tag, a member or
      element of one, or a literal; an expression bound to an input is
      refused by `logix/fb-pin` at check time. A negative number is written
      as one (`-5`), and a conversion that is a plain store (`DINT_TO_REAL(a)`
      into a REAL input) is written as its argument.
    source: "#rejected-at-check-time-by-name"
    tests:
      - go ./logix/writer TestSTBlockCallInputs
    note: >-
      That the Logix SDK build refuses any expression as an Add-On
      Instruction operand in ST (`(a / b)`, `(a)`, `-a`; RxSTX_E_UNEXPECTED_TOKEN)
      while it takes `a`, `p.y`, `-5` and `2.5` was observed on the v38 SDK
      (#368), not in CI. An element with a tag index (`arr[k]`) is accepted
      by the writer but was not built.

  - id: LGA-018
    claim: >-
      A project with a `target: logix` section gets the Logix rules from
      `naut check` without asking, and `naut check --target logix` applies
      them to any project.
    source: "#rejected-at-check-time-by-name"
    tests:
      - go ./cmd/naut TestCheckRunsTheManifestTarget
      - go ./cmd/naut TestCheckTargetLogix

  - id: LGA-019
    claim: >-
      `dialect: logix` adds a `TONR` block to every program in the project,
      with `Reset` clearing it while TRUE, and a free-running pulse spelled
      `t:TONR(PT := T#1S, Reset := t.Q)`; the default dialect adds nothing.
    source: "#vendor-idioms-dialect-logix"
    tests:
      - go ./internal/dialect TestLogixLibraryParsesAndIsDeclarationsOnly
    partial: true
    note: Only that the library parses and declares. No test runs a TONR on the nautilus runtime to check the Reset semantics.

  - id: LGA-020
    claim: >-
      In ladder the writer emits a `TONR` as a `TON` with a `RES(t)` rung
      ahead of the timer's rung; in ST, as `TONR(t);` on an `FBD_TIMER`
      whose `.Reset` is TRUE while `Reset` is TRUE or `IN` is FALSE.
    source: "#vendor-idioms-dialect-logix"
    tests:
      - go ./logix/writer TestTONR

  - id: LGA-021
    claim: >-
      A tag's `alias:` is written as a Logix alias tag (`AliasFor`) and the
      program names the tag; the nautilus runtime ignores the binding, so the
      same source runs in simulation.
    source: "#io-tag-aliases"
    tests:
      - go ./logix/writer TestAliasTags
      - go ./cmd/naut TestAliasedTagsRunInSimulationAndDeployAsAliases
    note: >-
      One project with `alias:` on its tags: `naut test` runs its seal-in
      scenario on the nautilus runtime, which ignores the binding, and the
      deploy (to a fake agent) writes those tags as alias tags (AliasFor) with
      the rung naming the tags.

  - id: LGA-022
    claim: >-
      `naut logix import --project` writes a nautilus project from a full
      export: the manifest with `target: logix` filled from the controller
      (and `dialect: logix` when the export uses its idioms), the tags with
      their descriptions, UDTs as IEC types, every ladder routine as a
      PROGRAM and every AOI as a FUNCTION_BLOCK in `lib/`.
    source: "#bringing-an-existing-program-in"
    tests:
      - go ./cmd/naut TestLogixImportProject
      - go ./logix/importer TestDemoLineImportsAndWritesBack
      - go ./logix/importer TestUDTConformanceImportsAndWritesBack
      - go ./logix/importer TestAOIConformanceImportsAndWritesBack
      - go ./logix/importer TestDialectAndAliasImport
      - go ./logix/importer TestEveryLadderRoutineBecomesAProgram
    note: >-
      TestEveryLadderRoutineBecomesAProgram imports an export with three
      ladder routines in two programs: three PROGRAM files, each a task in the
      manifest, each with its own rung; the manifest's target filled from the
      controller (name, processor, revision); controller-scope descriptions in
      the tag file.

  - id: LGA-023
    claim: >-
      A rung with no nautilus form is kept as a comment and reported, never
      guessed at.
    source: "#bringing-an-existing-program-in"
    tests:
      - go ./logix/importer TestRefusalsKeepTheProgramValid
      - go ./logix/importer TestVarietyReportsWhatItCannotCarry

  - id: LGA-024
    claim: >-
      Alias tags and rack points the logic names directly become tags with
      `alias:`, and a `RES` on a timer run by `TON` imports as `dialect:
      logix` `TONR`. A rung that names an alias tag comes in like any other:
      the tag takes its target's type, whether the target is a tag, a member
      of a UDT or Add-On Instruction instance, an array element, a bit or a
      rack point's bit. An alias the export cannot type, such as one of a
      whole rack word with no module definition, is refused by name.
    source: "#bringing-an-existing-program-in"
    tests:
      - go ./logix/importer TestDialectAndAliasImport
      - go ./logix/importer TestEveryLadderRoutineBecomesAProgram
      - go ./logix/importer TestAliasTagsInRungsImportAndRoundTrip
      - go ./logix/importer TestAliasTagsTheExportCannotTypeAreRefusedByName
    note: >-
      Rack points named directly, the TONR fold, and an alias tag in the
      export becoming a tag with `alias:` are asserted. A hand-built export
      (logix/importer/testdata/aliases.L5X) has rungs naming an alias of each
      target kind (Pump1Run; Pump1.Speed; the BIT member Pump1.Running; the
      Add-On Instruction output Valve1Ctl.Open; TankStatus.5;
      TankLevels[2]; Local:1:I.Data.3): every rung imports, each tag is
      declared as its target's type (BOOL, REAL), and written back the rung
      text is the export's with each tag an alias tag of the same target
      (#330). Refused by name, each asserted: an alias of Local:2:I.Ch0Data
      ("the export has no module definition to type it"), of a tag not in
      the export, of a whole TIMER, of a member the target lacks, and a
      program-scoped alias tag.

  - id: LGA-026
    claim: >-
      On a corpus of 52 real production exports, 97.9% of rungs import, 81%
      of ladder routines import whole, and most complete routines write back
      identically or equivalently.
    source: "#bringing-an-existing-program-in"
    tests:
      - go ./logix/importer TestCorpus
    partial: true
    note: The corpus is private (NAUTILUS_L5X_CORPUS), so the test skips in CI; the figure is not independently checkable.

  - id: LGA-027
    claim: >-
      `naut logix deploy` with no flag writes the project, has logixd import
      and build it, and says whether the running controller could take the
      change as an online edit or needs a download.
    source: "#the-loop"
    tests:
      - go ./logix/deploy TestBuildOnlyReportsWhatTheControllerNeeds
      - go ./logix/deploy TestEmptyControllerNeedsADownload
      - go ./logix/deploy TestDeployBuildsAnAOIProjectInTwoSteps
    partial: true
    note: Run against a fake agent; no controller behind it in CI.

  - id: LGA-028
    claim: >-
      `naut logix deploy --online` replaces the routine's rungs in the
      running program and finalizes them, leaving the controller's mode, and
      is refused when the tag set changed because an online edit cannot
      create tags.
    source: "#the-loop"
    tests:
      - go ./logix/deploy TestOnlineEditReplacesTheRungsAndVerifies
      - go ./logix/deploy TestOnlineEditRefusesATagChange
      - go ./logix/deploy TestSessionEditsWithoutReopening
      - go ./logix/deploy TestSessionRefusesATagChange
    partial: true
    note: Run against a fake agent; real warm edits are verified on hardware only.

  - id: LGA-029
    claim: >-
      `naut logix deploy --download` refuses without `--yes`, and the
      controller must already be in Program mode or `--program-mode`
      passed.
    source: "#the-loop"
    tests:
      - go ./cmd/naut TestLogixDeployRefusals
      - go ./logix/deploy TestDownloadVerifies
    partial: true
    note: The "controller must be in Program mode" refusal is not asserted separately; real downloads are verified on hardware only.

  - id: LGA-030
    claim: >-
      Every deploy path ends by uploading the controller's program again and
      comparing its logic with what was sent.
    source: "#the-loop"
    tests:
      - go ./logix/deploy TestOnlineEditReplacesTheRungsAndVerifies
      - go ./logix/deploy TestDownloadVerifies
    partial: true
    note: Verified against a fake agent that returns the sent logic.

  - id: LGA-031
    claim: >-
      A program the target cannot express is refused before anything is
      written: `naut logix deploy` stops on the diagnostic before the agent
      is called.
    source: "#rejected-at-check-time-by-name"
    tests:
      - go ./logix/deploy TestSubsetDiagnosticsStopEverything

  - id: LGA-032
    claim: >-
      `naut logix mode [--yes run|program] <project-dir>` reads or changes
      the controller's mode; a change takes `--yes`.
    source: "#the-loop"
    tests:
      - go ./cmd/naut TestLogixModeRefusesAChangeWithoutConfirmation
      - go ./cmd/naut TestLogixModeTakesTheProjectDirectory
      - go ./cmd/naut TestLogixModeReadsAndChangesTheMode
    partial: true
    note: >-
      The refusal without `--yes` is tested, and against a fake agent `naut
      logix mode` reads the mode through a project uploaded from the named
      controller (without changing it) and with `--yes program` changes it.
      The controller's mode actually changing is the SDK's, verified on
      hardware only.

  - id: LGA-033
    claim: >-
      `naut logix write program.ld` writes an L5X without a project.
    source: "#the-loop"
    tests:
      - go ./cmd/naut TestLogixWrite

  - id: LGA-034
    claim: >-
      `naut test --target logix` runs the project's acceptance tests against
      the controller over EtherNet/IP: `given` writes go to the controller,
      `advance:` is wall time, `until`, `hold` and `always` are checked on
      every poll, and it waits on the `side.heartbeat` scan counter.
    source: "#the-loop"
    tests:
      - go ./acceptance TestLiveSealInAndAlarm
      - go ./acceptance TestLiveUntilHoldAndAlways
      - go ./acceptance TestLiveScansWaitOnTheHeartbeat
    partial: true
    note: >-
      Run against a stand-in controller (mechanics only); no test drives a
      real or emulated Logix controller through `naut test --target logix`.
      always: catches a transient violation per poll; `advance:` as wall time
      is asserted only as a positive elapsed time.

  - id: LGA-035
    claim: >-
      The logixd agent URL comes from `target.logix.agent` and
      `NAUTILUS_LOGIXD_URL` overrides it; the token comes only from
      `NAUTILUS_LOGIXD_TOKEN`.
    source: "#a-project-with-a-logix-target"
    tests:
      - go ./logix/logixd TestClientDefaultsFromEnvironment
      - go ./cmd/naut TestLogixDeployFindsTheAgent
    note: >-
      With two fake agents: a deploy reaches the one named by
      target.logix.agent and every request carries NAUTILUS_LOGIXD_TOKEN as
      its bearer; with NAUTILUS_LOGIXD_URL set it reaches that one instead; a
      manifest with a `token:` under target.logix is refused.

  - id: LGA-036
    claim: >-
      Anything outside the subset is refused, not approximated.
    source: "#what-it-does-not-do-yet"
    tests:
      - go ./logix/writer TestRejections
      - go ./logix/writer TestStructuredTextRejections
      - go ./logix/writer TestRefusalsTheTableNames
      - go ./cmd/naut TestLogixTargetRefusesSFCAndASecondTask
      - go ./cmd/naut TestCheckTargetLogixRefusesOtherLanguages
    note: >-
      Every rule in the page's table has a refusal case (trailing-underscore
      names and an AOI with an array parameter included), and FBD and SFC
      programs and a multi-task project are refused, each with nothing
      written.

  - id: LGA-037
    claim: >-
      A download resets tag values to the project's values; an online edit
      keeps them.
    source: "#what-it-does-not-do-yet"
    tests:
      - go ./logix/deploy TestHardwareDownloadResetsValuesAndAnOnlineEditKeepsThem
    partial: true
    note: >-
      Verified on hardware only: the test downloads DemoLine, sets HiLevelSP
      to 70 over EtherNet/IP, makes an online edit and expects 70 kept, then
      downloads again and expects the project's 85. It needs a controller that
      may be stopped (NAUTILUS_LOGIX_DOWNLOAD_COMM_PATH, NAUTILUS_LOGIX_HOST)
      and logixd; skipped in CI and not yet run (the SDK machine is
      unavailable).

  - id: LGA-040
    claim: >-
      With `naut logix serve --project`, an online edit from the editor is
      the same online edit `naut logix deploy --online` makes, and its
      progress and result reach the editor as they happen; a change it
      cannot carry is refused with the way to download it.
    source: "#from-the-editor"
    tests:
      - go ./logix/facade TestDeployStreamOnlineEdit
      - go ./logix/facade TestDeployStreamRefusal
      - go ./logix/facade TestProgramPlaneDeploysAnOnlineEdit
    partial: true
    note: >-
      Against a stand-in deploy function: the endpoint streams each progress
      line, then the report, and serves the new source; a NeedsDownloadError
      arrives as a 422 error event naming the download command. The deploy
      itself (logix/deploy.Session) has its own fake-agent tests; neither
      has run against a controller through the editor yet.

  - id: LGA-041
    claim: >-
      A download from the editor is refused unless the request says yes;
