# fb-instances — two instances of one standard block (CTU) in ST, LD, FBD
# and SFC: each instance keeps its own state between scans, and its
# outputs read as inst.Pin in every language (a BOOL pin and an INT pin).
#
#   go test ./lang/conformance/ -run 'TestConformance/fb-instances'
name: fb-instances

tasks:
  - program: fb-instances.st
    scan: 1ms
  - name: ld
    program: fb-instances.ld
    scan: 1ms
  - name: fbd
    program: fb-instances.fbd
    scan: 1ms
  - name: sfc
    program: fb-instances.sfc
    scan: 1ms

tags:
  - { name: CU1, role: state, init: false, desc: "Count input of the first instance" }
  - { name: CU2, role: state, init: false, desc: "Count input of the second instance" }
  - { name: PV,  role: state, init: 2,     desc: "Preset of both instances" }

  - { name: st_Q1,   role: state, init: false }
  - { name: st_CV1,  role: state, init: 0 }
  - { name: st_Q2,   role: state, init: false }
  - { name: st_CV2,  role: state, init: 0 }
  - { name: ld_Q1,   role: state, init: false }
  - { name: ld_CV1,  role: state, init: 0 }
  - { name: ld_Q2,   role: state, init: false }
  - { name: ld_CV2,  role: state, init: 0 }
  - { name: fbd_Q1,  role: state, init: false }
  - { name: fbd_CV1, role: state, init: 0 }
  - { name: fbd_Q2,  role: state, init: false }
  - { name: fbd_CV2, role: state, init: 0 }
  - { name: sfc_Q1,  role: state, init: false }
  - { name: sfc_CV1, role: state, init: 0 }
  - { name: sfc_Q2,  role: state, init: false }
  - { name: sfc_CV2, role: state, init: 0 }

driver:
  type: memory
