# fb-ctu — the standard CTU (up counter) in ST, LD and FBD. One task per
# language, outputs prefixed st_/ld_/fbd_ so one assertion checks all
# three paths. In the ld column rung power drives CU and continues from Q.
#
#   go test ./lang/conformance/ -run 'TestConformance/fb-ctu'
name: fb-ctu

tasks:
  - program: fb-ctu.st
    scan: 1ms
  - name: ld
    program: fb-ctu.ld
    scan: 1ms
  - name: fbd
    program: fb-ctu.fbd
    scan: 1ms

tags:
  - { name: CU, role: state, init: false, desc: "Count-up input (CTU.CU), counts rising edges" }
  - { name: R,  role: state, init: false, desc: "Reset input (CTU.R): CV := 0" }
  - { name: PV, role: state, init: 3,     desc: "Preset value (CTU.PV)" }

  - { name: st_Q,   role: state, init: false }
  - { name: st_CV,  role: state, init: 0 }
  - { name: ld_Q,   role: state, init: false }
  - { name: ld_CV,  role: state, init: 0 }
  - { name: fbd_Q,  role: state, init: false }
  - { name: fbd_CV, role: state, init: 0 }

driver:
  type: memory
