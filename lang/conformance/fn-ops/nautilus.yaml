# fn-ops — the operator blocks of docs/functions.md "Operators": AND, OR,
# XOR (logical on BOOL, n-ary), NOT, ADD and MUL (n-ary), SUB (binary), DIV
# and MOD on integers, MOVE, and the six comparisons on INT, REAL and TIME.
# FBD calls the blocks by name; ST writes the operators they lower to. Every
# step asserts both. Bitwise AND/OR/XOR/NOT on integers is st-bitwise.
#
#   go test ./lang/conformance/ -run 'TestConformance/fn-ops'
#   go run ./cmd/naut test lang/conformance/fn-ops
name: fn-ops

tasks:
  - program: fn-ops.st   # the first task is always "main"; its prefix is still st_
    scan: 10ms
  - name: fbd
    program: fn-ops.fbd
    scan: 10ms

tags:
  # Shared inputs.
  - { name: A, role: state, init: false }
  - { name: B, role: state, init: false }
  - { name: C, role: state, init: false }
  - { name: X, role: state, init: 0 }
  - { name: Y, role: state, init: 0 }
  - { name: Z, role: state, init: 0 }
  - { name: R, role: state, init: 0.0 }
  - { name: RX, role: state, init: 0.0 }
  - { name: RY, role: state, init: 0.0 }
  - { name: T1, role: state, init: 0 }
